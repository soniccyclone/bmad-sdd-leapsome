services:
  # Always starts — used by all profiles and `make dev`
  postgres:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://todo:todo@postgres:5432/todo
      FRONTEND_URL: http://localhost:8080
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:5173"

  # Test: creates todo_test database alongside the default todo database
  test-db-setup:
    profiles: [test]
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: todo
      PGPASSWORD: todo
    entrypoint: >
      sh -c "psql -tc \"SELECT 1 FROM pg_database WHERE datname = 'todo_test'\" | grep -q 1
      || psql -c 'CREATE DATABASE todo_test'"
    restart: "no"

volumes:
  pgdata:
